<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campus LMS</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="bar"><strong class="brand"><span>CL</span> Campus LMS</strong><button id="logout" class="secondary" hidden>Đăng xuất</button></header>
  <main>
    <section id="login" class="card" aria-labelledby="login-title">
      <h1 id="login-title">Đăng nhập</h1>
      <button id="sso" disabled>Đăng nhập bằng Microsoft SSO</button>
    </section>
    <section id="home" aria-labelledby="home-title" hidden>
      <div class="card">
      <p class="section-label">Trang chủ</p>
      <h1 id="home-title">Xin chào, <span id="name"></span></h1>
      <p id="username"></p>
      <p class="success">Đăng nhập thành công.</p>
      </div>
    </section>
    <p id="status" class="status" role="status"></p>
  </main>
</body>
</html>
